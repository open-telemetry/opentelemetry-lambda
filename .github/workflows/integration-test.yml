name: "Integration Tests"

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to test (or all)'
        required: true
        type: choice
        options:
          - all
          - nodejs
          - python
          - ruby
          - javaagent
          - javawrapper
        default: all
  workflow_call:
    inputs:
      language:
        description: 'Language to test (or all)'
        required: true
        type: string
      use-existing-layer-artifact:
        description: 'Use an existing instrumentation layer artifact instead of building from scratch'
        required: false
        default: false
        type: boolean
    secrets:
      INTEGRATION_TEST_ROLE_ARN:
        required: true

permissions:
  contents: read

jobs:
  prepare-languages:
    runs-on: ubuntu-26.04
    outputs:
      languages: ${{ steps.prepare-languages.outputs.languages }}
    steps:
      - id: prepare-languages
        name: Prepare Languages
        run: |
          if [ "${INPUTS_LANGUAGE}" = "all" ]; then
            languages='["nodejs", "python", "ruby", "javaagent", "javawrapper"]'
          else
            languages="[\"${INPUTS_LANGUAGE}\"]"
          fi
          echo "languages=${languages}" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_LANGUAGE: ${{ inputs.language }}

  build-collector:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-collector-layer
        id: build
        with:
          architecture: ${{ matrix.architecture }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentelemetry-collector-layer-${{ matrix.architecture }}-${{ inputs.language }}.zip
          path: ${{ steps.build.outputs.artifact-path }}

  build-layer:
    needs: prepare-languages
    if: ${{ !inputs.use-existing-layer-artifact }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.prepare-languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-layer
        id: build
        with:
          language: ${{ matrix.language }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentelemetry-${{ matrix.language }}-layer.zip
          path: ${{ steps.build.outputs.artifact-path }}

  test:
    needs: [prepare-languages, build-collector, build-layer]
    if: |
      !cancelled() &&
      needs.build-collector.result == 'success' &&
      (needs.build-layer.result == 'success' || needs.build-layer.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.prepare-languages.outputs.languages) }}
        architecture: [amd64, arm64]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'integration-tests/.nvmrc'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentelemetry-collector-layer-${{ matrix.architecture }}-${{ inputs.language }}.zip
          path: artifacts/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opentelemetry-${{ matrix.language }}-layer.zip
          path: artifacts/

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.INTEGRATION_TEST_ROLE_ARN }}
          role-duration-seconds: 1200
          aws-region: us-east-1

      - if: ${{ startsWith(matrix.language, 'java') }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        if: ${{ startsWith(matrix.language, 'java') }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # MIT licensed (see https://github.com/gradle/actions/releases/tag/v6.1.0)

      - name: Build Java handler jar
        if: ${{ startsWith(matrix.language, 'java') }}
        run: ./gradlew shadowJar
        working-directory: integration-tests/handlers/java

      - name: Install integration test dependencies
        run: npm ci
        working-directory: integration-tests

      - name: Run integration tests
        run: npx vitest run --config vitest.config.ts
        working-directory: integration-tests
        env:
          TEST_LANGUAGE: ${{ matrix.language }}
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
          COLLECTOR_LAYER_ZIP: ${{ github.workspace }}/artifacts/opentelemetry-collector-layer-${{ matrix.architecture }}.zip
          INSTRUMENTATION_LAYER_ZIP: ${{ github.workspace }}/artifacts/opentelemetry-${{ matrix.language }}-layer.zip
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
