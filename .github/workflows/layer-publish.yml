name: Publish Lambda Layer

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'This should correspond to a actions/upload-artifact name earlier in the build. The file name and the name of the artifact containing it must be equal.'
        required: true
        type: string
      layer-name:
        description: 'Layer name not including other parts like arch or version.'
        required: true
        type: string
      component-version:
        description: 'Version of the component included in this release. Not the same as the layer/tagged version.'
        required: true
        type: string
      architecture:
        description: '(optional) amd64 or arm64'
        required: false
        type: string
      runtimes:
        description: '(optional) a space delimited list of compatible runtimes (from https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html)'
        required: false
        type: string
      release-group:
        description: 'Release to dev or prod? "prod" yields empty value. (Default: dev)'
        required: true
        default: dev
        type: string
      aws_region:
        description: 'Publish to which AWS region?'
        required: true
        type: string
      role-arn:
        description: '(optional) AWS IAM Role ARN to be assumed for publishing layer. If no input is given, defaults to `PROD_LAMBDA_ROLE_ARN` secret.'
        required: false
        type: string
      layer-version:
        description: '(optional) Layer version to be used in the layer name. If no input is given, its value is tried to be extracted from the `GITHUB_REF_NAME` variable'
        required: false
        type: string
    secrets:
      OTEL_LAMBDA_LAYER_PUBLISH_ROLE_ARN:
        required: false
      PROD_LAMBDA_ROLE_ARN:
        required: false

permissions:
  contents: read

jobs:
  publish_layer:
    permissions:
      id-token: write # required for AWS OIDC authentication
    runs-on: ubuntu-latest

    steps:

      - name: Construct Layer Name
        shell: bash
        run: |
          LAYER_NAME="${INPUTS_LAYER_NAME}"
          
          if [[ -n "${INPUTS_ARCHITECTURE}" ]]; then
            LAYER_NAME="${LAYER_NAME}-${INPUTS_ARCHITECTURE}"
            ARCH=$(echo "${INPUTS_ARCHITECTURE}" | sed -r 's/amd64/x86_64/g')
          else
            ARCH="x86_64 arm64"
          fi
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          
          if [[ -n "${INPUTS_RUNTIMES}" ]]; then
            COMPATIBLE_RUNTIMES="--compatible-runtimes ${INPUTS_RUNTIMES}"
          fi
          echo "COMPATIBLE_RUNTIMES=$COMPATIBLE_RUNTIMES" >> $GITHUB_ENV
          
          if [[ "${INPUTS_RELEASE_GROUP}" != "prod" ]]; then
            LAYER_NAME="${LAYER_NAME}-${INPUTS_RELEASE_GROUP}"
          fi
          
          if [[ -n "${INPUTS_LAYER_VERSION}" ]]; then
            LAYER_VERSION="${INPUTS_LAYER_VERSION}"
          else
            LAYER_VERSION=$(echo "$GITHUB_REF_NAME" | sed -r 's/.*\/[^0-9\.]*//g')
          fi
          LAYER_VERSION_CLEANED=$(echo "$LAYER_VERSION" | sed -r 's/\./_/g')          
          
          if [[ -n "$LAYER_VERSION_CLEANED" ]]; then
            LAYER_NAME=$LAYER_NAME-$LAYER_VERSION_CLEANED
          fi
          echo "LAYER_NAME=$LAYER_NAME" >> $GITHUB_ENV
          
          echo GITHUB_ENV:
          cat $GITHUB_ENV
        env:
          INPUTS_LAYER_NAME: ${{ inputs.layer-name }}
          INPUTS_ARCHITECTURE: ${{ inputs.architecture }}
          INPUTS_RUNTIMES: ${{ inputs.runtimes }}
          INPUTS_RELEASE_GROUP: ${{ inputs.release-group }}
          INPUTS_LAYER_VERSION: ${{ inputs.layer-version }}

      - name: Download built layer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role-arn || secrets.OTEL_LAMBDA_LAYER_PUBLISH_ROLE_ARN || secrets.PROD_LAMBDA_ROLE_ARN }}
          role-duration-seconds: 1200
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: false

      - name: Publish Lambda Layer
        run: |
          LAYER_ARN=$(
            aws lambda publish-layer-version \
              --layer-name $LAYER_NAME \
              --license-info "Apache 2.0" \
              --compatible-architectures $ARCH \
              $COMPATIBLE_RUNTIMES \
              --zip-file "fileb://${INPUTS_ARTIFACT_NAME}" \
              --query 'LayerVersionArn' \
              --output text
          )
          echo "::notice ::$LAYER_ARN component-version=${INPUTS_COMPONENT_VERSION}"
        env:
          INPUTS_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          INPUTS_COMPONENT_VERSION: ${{ inputs.component-version }}
        # echo "* $LAYER_ARN" >> $GITHUB_STEP_SUMMARY

      - name: Make Layer Public
        run: |
          LAYER_VERSION=$(
            aws lambda list-layer-versions \
              --layer-name $LAYER_NAME \
              --query 'max_by(LayerVersions, &Version).Version'
          )
          aws lambda add-layer-version-permission \
            --layer-name $LAYER_NAME \
            --version-number $LAYER_VERSION \
            --principal "*" \
            --statement-id publish \
            --action lambda:GetLayerVersion
